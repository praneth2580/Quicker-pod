name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag to create/update (e.g. v0.1.0). Leave empty to upload to an existing draft for this ref."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: |
          npm ci
          npm ci --prefix plugins/tripper-ble

      - name: Guard Android project
        run: |
          test -d android
          test -x android/gradlew

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="apk-${{ github.sha }}"
          fi
          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          CODE="$(grep -E '^\s*versionCode\s+[0-9]+' android/app/build.gradle | head -1 | grep -oE '[0-9]+$' || echo 0)"
          ASSET="quicker-pod-${VERSION}.apk"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "version_code=${CODE}"
            echo "asset=${ASSET}"
          } >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: APK_VERSION="${{ steps.meta.outputs.version }}" bash scripts/build-apk.sh "${{ steps.meta.outputs.version }}"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Quicker-pod ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: dist-apk/${{ steps.meta.outputs.asset }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write apk-latest.json for Pages deploy
        if: startsWith(steps.meta.outputs.tag, 'v')
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          CODE: ${{ steps.meta.outputs.version_code }}
          ASSET: ${{ steps.meta.outputs.asset }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const tag = process.env.TAG;
          const version = process.env.VERSION;
          const code = Number(process.env.CODE || 0);
          const owner = process.env.OWNER;
          const repo = process.env.REPO;
          const asset = process.env.ASSET;
          const downloadUrl = `https://github.com/${owner}/${repo}/releases/download/${tag}/${asset}`;
          const payload = {
            version,
            versionCode: code,
            tag,
            assetName: asset,
            downloadUrl,
            releasesPageUrl: `https://github.com/${owner}/${repo}/releases/tag/${tag}`,
            publishedAt: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
          };
          fs.mkdirSync("public", { recursive: true });
          fs.writeFileSync("public/apk-latest.json", JSON.stringify(payload, null, 2) + "\n");
          console.log("Wrote public/apk-latest.json for", tag, asset);
          NODE

      - name: Build landing site
        if: startsWith(steps.meta.outputs.tag, 'v')
        run: npm run build:web

      - name: Deploy landing site with download metadata
        if: startsWith(steps.meta.outputs.tag, 'v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-site
          publish_branch: gh-pages
          force_orphan: false
